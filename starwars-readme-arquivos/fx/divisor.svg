<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="40" viewBox="0 0 1600 40">
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#4bd5ee" stop-opacity="0"/><stop offset="0.3" stop-color="#4bd5ee"/><stop offset="0.5" stop-color="#b98cff"/><stop offset="0.7" stop-color="#ff3b3b"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect x="100" y="17" width="1400" height="6" rx="3" fill="url(#g)" filter="url(#glow)" opacity="0.6"><animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="100" y="18.5" width="1400" height="3" rx="1.5" fill="url(#g)"/>
<rect x="-200" y="18" width="200" height="4" fill="url(#shine)"><animate attributeName="x" values="-200;1600" dur="3.5s" repeatCount="indefinite"/></rect>
</svg>